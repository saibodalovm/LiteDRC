[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litedrc"
version = "0.1.0"
description = "LiteDRC: Lightweight DRC hotspot detection with PDK conditioning"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=1.10.0",
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0",
    "pyyaml>=6.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["litedrc*"]
